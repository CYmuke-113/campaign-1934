name: Build & Deploy Unity WebGL (V1.1)

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/**'
      - 'Assets/**'
      - '*.unityproject/**'
      - '.github/workflows/unity-deploy-v11.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Unity WebGL build using game-ci ----
      # Ref: https://github.com/game-ci/unity-builder
      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-Windows-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          # Unity version is read from ProjectSettings/ProjectVersion.txt
          # Ensure the project uses Unity 2022.3 LTS with WebGL support installed

      # ---- Upload build artifact ----
      - name: Upload WebGL build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
